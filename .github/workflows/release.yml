name: Release artefacts

# Builds the macOS `.app`/`.dmg`, the Windows `.exe`, the Linux
# `AppImage`/`.deb` and the standalone single-file HTML page, and attaches them
# all to a **draft** release for the tag that triggered it, for a human to look
# at and then publish.
#
# Four artefacts, three of which are installers and one of which is a web page a
# reader opens from their downloads directory. See the `standalone` job for why
# it is not a fourth leg of the matrix.
#
# **The trigger is the tag, and it has to be.** This ran on `release: [created]`
# for one release, on the stated belief that "`created` fires for a draft
# release too". It does not, and GitHub says so in as many words:
#
#   > Workflows are not triggered for the `created`, `edited`, or `deleted`
#   > activity types for draft releases.
#
# So the recommended flow — save a draft, let three legs attach their artifacts,
# press publish — could not fire at all, and produced a draft with nothing on
# it. The only release activity that reaches a draft is `published`, which is
# after the moment the binaries were wanted.
#
# The old header argued against a tag trigger: tags get pushed for all sorts of
# reasons, and `npm version` makes one on every patch bump. In this repository
# it does not: `preversion` runs the typecheck and the suite, and
# `scripts/changelog-check.mjs` refuses a version CHANGELOG.md does not mention.
# A `v*` tag here has already been through both, so it *is* a release. If a tag
# ever should not build installers, exclude it by name in `tags:` below.
#
# A re-run for an existing tag is `workflow_dispatch`. It is careful in a way
# the automatic path need not be: the release it attaches to may already be
# published, so it changes neither that state nor the body. See `collect`.
#
# `deploy.yml` is not touched by any of this, and that is the concrete form of
# the guarantee the desktop target was built under: the web app is published by
# a different workflow, from a different command (`npm run build`), and nothing
# here can reach it.
#
# Which is why the concurrency group below is **not** `pages`. Sharing that group
# would make a release serialise the installer build against the site
# deployment, or cancel it outright, and the failure would look like GitHub
# being slow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach to (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed on the tag rather than on `github.ref`, which is not the same string
  # for the two triggers — a manual re-run must queue behind the automatic one
  # for the same release rather than race it for the same asset names.
  #
  # `inputs.tag` first, because on a `workflow_dispatch` run `github.ref_name`
  # is the default branch and not the tag being built.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One red leg should not hide the state of the other two: the interesting
      # question after a failure is whether it is platform-specific.
      fail-fast: false
      matrix:
        include:
          # `macos-13` no longer exists as a runner label and `macos-14` is
          # deprecated. A job naming a removed label does not fail — it queues
          # indefinitely, so the release simply hangs.
          #
          # One macOS leg builds both architectures. There are no native modules
          # to compile (h5wasm is a single file with the wasm inlined), so the
          # x64 slice is a copy of the same JavaScript beside a different
          # Electron binary.
          - id: mac
            os: macos-15
            args: --mac
          # TEMPORARILY DISABLED — Windows installers are not built or attached.
          #
          # Commented rather than deleted, and kept in place rather than moved
          # to the bottom, so restoring it is uncommenting three lines and not
          # reconstructing them. `fail-fast: false` above means the other legs
          # were never depending on this one, and `collect` attaches whatever
          # artifacts exist, so nothing else needs changing either way.
          #
          # Two things must come back *with* it: the release-body paragraph
          # below says which platforms warn about an unsigned installer, and
          # `docs/desktop.md` documents the Windows SmartScreen click. Both were
          # narrowed to macOS while this is off; both are wrong the moment it
          # returns.
          #
          # - id: win
          #   os: windows-latest
          #   args: --win
          - id: linux
            os: ubuntu-latest
            args: --linux

    steps:
      # Explicitly the tag. A tag push's default ref is already that tag, but a
      # `workflow_dispatch` run's is the default branch — so without this a
      # manual re-run would quietly build `main` and attach the result to an
      # older release as if it were that version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Electron's binary is fetched lazily on first use and is ~100 MB per
      # platform. Cached here and nowhere else: the Pages and test jobs never
      # touch it, so this must not become a repository-wide cache step.
      - name: Cache the Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      # Typechecks both projects, builds the renderer, compiles the main
      # process and asserts the shape of what came out.
      - name: Build the renderer and the main process
        run: npm run build:desktop
        env:
          # The site's registrations with Google and Dropbox, as repository
          # variables (docs/deploy.md). None is a secret; all end up in the page.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --config electron-builder.config.cjs --publish never
        env:
          # A runner keychain must never silently supply a real Developer ID.
          # These releases are unsigned, `docs/desktop.md` says so, and a build
          # that quietly became signed would make that document wrong.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # `mac.identity: '-'` is ad-hoc signing, and the difference between that
      # and no signature at all is the difference between an app that runs on
      # Apple Silicon and one that does not. Nothing else in the pipeline can
      # tell them apart: both build, both upload, both install.
      - name: Assert the macOS build is at least ad-hoc signed
        if: matrix.id == 'mac'
        run: |
          set -euo pipefail
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app" || { echo "no .app in release/"; exit 1; }
          # `|| true` so that the grep below is what fails the job: codesign
          # exits non-zero on an unsigned binary, and under `pipefail` that
          # would kill the step before it could say why.
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt || true
          if grep -q 'code object is not signed at all' /tmp/codesign.txt; then
            echo "::error title=Unsigned binary::mac.identity produced no signature — check it is '-' and not null."
            exit 1
          fi

      - name: Verify the packed archive
        run: node scripts/check-package.mjs

      - uses: actions/upload-artifact@v4
        with:
          # v4 refuses duplicate artifact names within one run, so the matrix id
          # is part of the name rather than a suffix someone might drop.
          name: chromosomix-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Not a fourth matrix leg, and the reason is that it shares none of the
  # matrix's shape: no Electron cache, no code signature, no per-platform
  # packaging, and a build that takes seconds rather than minutes. Folding it in
  # would mean three `if: matrix.id != 'standalone'` guards on steps that exist
  # for the installers alone.
  #
  # It is also the one artefact here that does not need installing, which is the
  # point of shipping it beside three that do: a reader who will not run an
  # unsigned binary gets a file they double-click instead.
  standalone:
    name: standalone HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, for the same reason the matrix does it: `__APP_COMMIT__`
          # and `__APP_VERSION__` are baked into the page, and a manual re-run
          # defaults to the branch.
          ref: ${{ inputs.tag || github.ref_name }}
          # `vite.standalone.config.ts` shells out to `git rev-parse` and
          # `git log -1`, and a depth-1 checkout has both.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Typechecks, builds, and then `check-standalone-build.mjs` asserts the
      # thing that matters: one file, self-contained, within the size bounds. A
      # build that silently stopped inlining still produces an `index.html`, so
      # without that check this job would go green while uploading a shell.
      - name: Build the standalone page
        run: npm run build:standalone

      # Renamed on the way out. `index.html` is what a browser calls every
      # second page and what a download directory already contains three of; the
      # asset a reader is emailed should say what it is and which version it is.
      - name: Name it for a download directory
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: mv dist-standalone/index.html "dist-standalone/chromosomix-${TAG}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: chromosomix-standalone
          path: dist-standalone/*.html
          if-no-files-found: error
          # The default is 9, and this one file compresses to about a fifth of
          # its size. Worth the seconds on an artefact this large.
          compression-level: 9

  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, for the reason the other two jobs give — `__APP_COMMIT__`
          # and `__APP_VERSION__` are baked into the build — and for one more
          # that is this job's own: a *clean* checkout has no `dist-electron/`,
          # and npm force-includes the file `main` names ahead of `files`. A
          # publish from somebody's working tree would carry 18 KB of compiled
          # Electron main process with it, inert but not intended. Here there is
          # nothing to carry.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # What makes `npm publish` authenticate with NODE_AUTH_TOKEN below
          # rather than with whatever is in a runner's `.npmrc`, which is
          # nothing.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Two ways this job should do nothing, and neither is a failure.
      #
      # **No token.** Publishing needs a secret only the repository owner can
      # add, and a fork, or this repository before anyone has added one, must
      # not turn a green release into a red one over a channel it was never
      # set up for. `secrets` cannot be read in an `if:`, so it comes through
      # the environment, where it can.
      #
      # **Already published.** A version on npm is immutable, so a
      # `workflow_dispatch` re-run of a tag — which is the documented way to
      # rebuild installers for a release — would otherwise fail on its second
      # invocation, every time, for doing exactly what it was asked to do.
      - name: Should this publish?
        id: decide
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "no NPM_TOKEN secret — skipping the registry" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry — skipping" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      # `prepack` runs `build:package` here, so what is uploaded is built from
      # this checkout at this moment and then asserted by
      # `check-package-build.mjs` — which is the only thing standing between a
      # site build's absolute asset URLs and a version that can never be
      # corrected. `--access public` is stated rather than assumed: the default
      # for an unscoped name is already public, and saying so is what keeps this
      # working if the package is ever moved under a scope.
      - name: Publish
        if: steps.decide.outputs.publish == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  collect:
    name: attach to the release
    needs: [build, standalone]
    runs-on: ubuntu-latest
    # The only job in this workflow that can write anything, and it writes one
    # thing: assets onto an existing release. Never `pages:` or `id-token:` —
    # those belong to deploy.yml, and nothing here has any business publishing a
    # website.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # For CHANGELOG.md, which is where the release body comes from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What was collected
        run: ls -la artifacts

      # The section this version already has in CHANGELOG.md — the release is
      # cut from a tag now, so nobody has hand-written a body first, and a draft
      # whose only text is the unsigned-installer note below would be a
      # regression on what a human used to paste in. `changelog-check.mjs`
      # guarantees the section exists: `npm version` refuses a release without
      # one.
      - name: The changelog section for this tag, as the release body
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          cat >> notes.md <<'NOTE'

          ---

          **There is no Windows build in this release.** The Windows leg of the
          release workflow is temporarily disabled; use the standalone HTML page
          below, which needs no installer on any platform.

          **These installers are unsigned.** macOS will warn once before running
          one; [docs/desktop.md](docs/desktop.md) gives the warning verbatim and
          the exact click that gets past it. A signature says who published a
          build, not whether it works.

          `chromosomix-*.html` is the whole viewer as **one page you
          double-click** — no install, no server, nothing to trust. It opens
          files from your own disk only; remote URLs and the example datasets
          need the hosted app, because a page opened from a disk has no origin
          it is allowed to fetch from.

          The web app at https://chromosomix.app/ is the same
          viewer and needs no installation.
          NOTE

      - uses: softprops/action-gh-release@v2
        with:
          # Named explicitly so the manual re-run path attaches to the same
          # place, and so nothing here can create a second release by accident.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          # `'true'` on a tag push, `''` on a manual re-run — and the empty
          # string is the whole point of writing it this way. The action reads
          # `env.INPUT_DRAFT ? env.INPUT_DRAFT === 'true' : undefined`, so an
          # empty value is *omitted* from the API call and GitHub leaves the
          # release's state alone, while `'false'` would publish it.
          #
          # Omitting it outright is what the previous version did, on the
          # reasoning that "passing either would change the state of a release
          # someone has already published". That had it backwards, and published
          # v0.4.0: this action's own documentation says "when reusing an
          # existing draft release, set this to `true` to keep it draft; omit it
          # to publish after upload."
          draft: ${{ github.event_name == 'push' || '' }}
          # Same shape, same reason: the automatic path owns the body and sets
          # it, and a re-run against a release whose text a human may have
          # edited leaves it untouched. `body_path` rather than `append_body`,
          # so running twice for one tag is idempotent instead of stacking a
          # second copy of the changelog onto the first.
          body_path: ${{ github.event_name == 'push' && 'notes.md' || '' }}
