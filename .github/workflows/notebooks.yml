name: Notebooks

# Renders the five notebooks that hold chromosomix to the packages it reproduces,
# to the viewers most used beside it, to its own command line, and to a machine
# like a reader's (SPECS §18.10), and publishes four of them beside the app:
#
#   https://chromosomix.app/validation/   notebooks/validation.qmd — every
#                                         analysis run twice, by chromosomix and
#                                         by its reference, and lined up
#   https://chromosomix.app/timings/      notebooks/timing.qmd — every command of
#                                         the validation run again and timed,
#                                         beside its reference's
#   https://chromosomix.app/viewers/      notebooks/viewers.qmd — a map and a
#                                         track drawn by chromosomix, juicebox.js
#                                         and HiGlass, timed, from disk and from
#                                         the bucket
#   https://chromosomix.app/parity/       notebooks/parity.qmd — ten tasks run
#                                         in the app in headless Chromium,
#                                         Firefox and WebKit, then from the
#                                         line its console wrote in each, and
#                                         the files the two wrote compared
#
# The fifth, notebooks/laptop.qmd — 23 analyses run genome-wide, each on the
# command line and in the app in headless Chromium, Firefox and WebKit, with
# their time and peak memory, then six over a deep human map one after the
# other, by chromosomix and by cooltools and coolpuppy — is meant for a
# laptop. The page at https://chromosomix.app/laptop/ is rendered by hand on
# one (`micromamba run -n open2c quarto render notebooks/laptop.qmd`, in the
# environment notebooks/environment-laptop.yml makes) and committed as
# notebooks/laptop.html, and deploy.yml publishes that file. This workflow
# renders it on a runner too, keeps it as the run's artifact and writes it into
# the run's summary, and never publishes it: not to the branch, not to a
# release.
#
# **When.** On every release, once it is published — release.yml makes the
# release a draft from the tag and a person publishes it, and that act is what
# fires `release: published` (a draft fires nothing, and neither would a
# release made with the workflow token) — and by hand: Actions → Notebooks →
# Run workflow, on any branch or tag, with the number of timed runs and
# whether to publish. A run from a branch that publishes replaces the pages a
# release put up; untick *publish* to look at a branch's pages in the run's
# artifacts instead.
#
# **A job a notebook, all at once.** `site` works out where the pages will be,
# for the links between them; then `parity`, `validation`, `viewers` and
# `laptop` start together, each on a runner of its own — a fresh machine, with
# its own disk, that fetches its own data — so that the run takes as long as
# its longest job rather than the sum of them. Nothing one measures is set
# beside what another measured: each comparison a page makes — chromosomix and
# a reference, the three viewers, the command line and the three browsers —
# is made on the one runner that page renders on, and each page names it.
# The validation and the timings are the one pair that share a job, because
# the timings run the validation's own commands again, on the inputs the
# validation fetched and made: about 8 GB that would otherwise go from one job
# to the next as an artifact on every run, which a private repository pays
# for, and the timings would still wait for the validation to finish. The
# viewers fetch their own 15 GB and read nothing the validation writes, so
# they have a job of their own, and the validation's runner holds 15 GB less.
# `laptop` takes the committed page out of the way first, so that what it
# gathers is its own render or nothing. Each job installs what it needs
# through .github/actions/notebooks-setup, gathers its pages with
# notebooks/scripts/pages.py — the one table of where each page is published
# and which files go beside it — and keeps them as an artifact for 90 days,
# even when it fails: the validation alone, and the timing rounds it finished,
# when the timings are what failed. `publish` waits for all four, publishes the
# four pages it publishes only if every one of them rendered — the laptop's
# render, published or not, is not one — and writes the run's summary either
# way: each notebook's address, version and time, the one line of findings it
# wrote, and its table. No job waits for another to pass, as they once waited
# for the parity: a render that fails, fails on its own runner, and the others
# finish and keep their artifacts; what the pages on the site cannot be is
# from two different runs.
#
# **What it installs**, and why pinned. The references are the versions the
# notebooks' prose names: `notebooks/requirements.txt` is the reference
# environment as the last render by hand had it, every package pinned, on
# Python 3.13, and every notebook renders in it; `notebooks/requirements-yapc.txt`
# is yapc 0.1's, on Python 3.11, which needs a numpy from before 1.24, and IDR
# 2.0.3 and yapc are built from their repositories at the commits the notebook
# cites, as the yapc section of scripts/make_analysis_golden.py does;
# `notebooks/requirements-pairtools.txt` is pairtools 1.1.2's, on Python 3.12,
# since it imports the `pipes` module 3.13 removed. Boost-HiC
# is a checkout; bedtools and seqkit are Ubuntu 24.04's own packages, which are
# the versions the notebook was written against. Quarto comes with the reference
# environment, as the `quarto-cli` package. The viewers the viewers' page opens
# on are pinned in `notebooks/viewers/package.json` (juicebox.js, HiGlass and
# the Playwright that drives Chromium for all three and for the parity and the
# laptop, and Firefox and WebKit for the parity and the laptop), and HiGlass's
# tile server in `notebooks/requirements-higlass.txt`, higlass-python's
# environment, with Ubuntu's libfuse 2 for the files it reads from a bucket.
#
# **What it costs.** Every run fetches its data rather than caching them —
# through notebooks/scripts/download.py, which asks again when a server fails, as
# GEO's answers one request in two with a 500 on some days — on each runner
# that needs them, a file two jobs read fetched by each: about 9.8 GB for the
# validation (4DN's, UCSC's mm10 through iGenomes, GEO's yeast Micro-C and
# ENCODE's GM12878 ChIP-seq and ATAC-seq, each from where it was published, the
# 0.55 GB of 4DN's 27-GB GM12878 map that § 24 reads by range — chr19 at 10 kb
# and at 2 kb — and the demo's 1.5 GB yeast contact list); 15 GB for the
# viewers (4DN's chicken and mouse maps in both formats, the mouse's 13 GB of
# it, and the app's yeast demo); 160 MB for the parity (GEO's yeast Micro-C and
# ATAC-seq, UCSC's sacCer3); 16.9 GB for the laptop (the validation's mouse
# and yeast maps, ATAC-seq and mm10, 4DN's 8.3 GB IMR-90 map, and hg38
# through iGenomes for its GC content). A cache that size would evict the
# repository's npm and Electron caches, and the buckets answer a runner at
# hundreds of megabytes a second; what a runner fetches costs nothing but its
# minutes, and every job's minutes are billed, its setup's included — five to
# seven of them, the app built and the reference environment installed again
# on each. From nothing, the validation renders in an hour to an hour and a
# half on a standard runner, every reference run for the first time, and the
# timings after it in about twenty minutes a run, so four runs leave the job
# room in the six hours a job may take — four, an even number, so that each
# side of a pair goes first in as many rounds as the other (timing.qmd's
# `round_of`). The viewers' pictures take about twenty minutes a round, four
# rounds, as many as there are viewers, so that each goes first once a
# picture. The laptop takes a couple of hours over its 23 analyses, on the
# command line and in the app's three browsers, and the six over the IMR-90
# map that end it come after, mostly `cooltools.dots` and chromosomix's loop
# calling over a whole human genome: one run, unless asked for more. The run
# takes as long as the longest of them. Every runner is a different machine,
# which is why each page says which one it ran on.
#
# **What it runs on, and the memory.** A standard runner for a private
# repository has 2 cores and 8 GB, 7.8 of them the job's — not the 4 cores and
# 16 GB a public one has. A reference that takes a number of processes is
# given one a core, at most four (validation.qmd's `THREADS`). Given four on
# two cores, six renders in nine were shut down, four of them in the cell where
# cooltools computes the expected over the mouse genome at 10 kb, its largest
# process alone at 3.6 GB: by every sign the log leaves, the memory ran out.
# GitHub shuts down a runner whose memory runs out in the
# middle of a step, with "The runner has received a shutdown signal": the
# command reports no error, no step after it runs, `if: always()` or not, and
# nothing is gathered or uploaded. So every render runs through
# notebooks/scripts/memory.sh, which writes the memory in use and available
# and the three programs holding the most into the step's log every ten
# seconds — the log streamed until the shutdown being all that is left of it.
#
# **Where it is published, and why through a branch.** Pages replaces the
# whole site on every deployment and only deploy.yml deploys it, so this
# workflow does what stores.yml does: it force-pushes the four pages, and the
# files beside them, to an orphan `notebooks` branch as one commit, and asks
# deploy.yml to publish; the deploy copies them into `validation/`,
# `timings/`, `viewers/` and `parity/` on every run after that, so a push to
# `main` keeps them. Which pages those are is `pages.py published`. Beside each
# page: `rendered.json`, what the stamp at its top says (when, from which
# commit and release, by which run, on what machine) and its line of findings;
# `commands.json`, `summary.tsv` and `validation.txt` beside the validation,
# every command it ran, every verdict and every number its figures draw, one
# row a mark (33 MB, most of it Boost-HiC's two maps of chr19 and the metaplot
# over two tracks); `timings.tsv` beside the timings, every timed run, one row
# each; `viewers.tsv` beside the viewers, every picture timed in a viewer;
# `summary.tsv` beside the parity, every file the app and the command line
# wrote, and its verdict. A release also gets the four pages and the five
# tables as assets of its own — `validation-<tag>.tsv` and `.txt`,
# `timings-<tag>.tsv`, `viewers-<tag>.tsv` and `parity-<tag>.tsv` — so a
# release's numbers outlive the next release's pages; its laptop page is the
# one committed in its source, which carries its tables, the deep human map's
# `pipeline.tsv` and `pipeline-memory.tsv` among them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runs:
        description: 'Timed runs of each command (timing.qmd); even, so each side of a pair goes first equally often'
        type: number
        default: 4
      viewer_runs:
        description: 'Rounds of the viewers’ pictures (viewers.qmd); four, so each viewer goes first once a picture'
        type: number
        default: 4
      pipeline_runs:
        description: 'Runs of the six analyses over the IMR-90 map that end the laptop (laptop.qmd)'
        type: number
        default: 1
      publish:
        description: 'Publish the pages at <site>/validation/, <site>/timings/, <site>/viewers/ and <site>/parity/ (never the laptop’s)'
        type: boolean
        default: true

permissions: {}

# One writer of the branch, and never a render cancelled three hours in for a
# newer one: a second run waits for the first.
concurrency:
  group: notebooks
  cancel-in-progress: false

env:
  NOTEBOOKS_BRANCH: notebooks

jobs:
  # Where the site is, for the links between the pages and to the files beside
  # them — the same resolution as deploy.yml and preview.yml — and the version
  # and commit every artifact of the run is named after.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      url: ${{ steps.site.outputs.url }}
      short: ${{ steps.site.outputs.short }}
      version: ${{ steps.site.outputs.version }}
    steps:
      # On a release, the release's tag: what is rendered is what was released.
      - uses: actions/checkout@v4

      - name: Resolve the site
        id: site
        run: |
          override='${{ vars.BASE_PATH }}'
          repo='${{ github.event.repository.name }}'
          if [ -n "$override" ]; then
            base="$override"
          elif [ -f public/CNAME ] || [ "${repo%.github.io}" != "$repo" ]; then
            base='/'
          else
            base="/$repo/"
          fi
          if [ -f public/CNAME ]; then host="$(tr -d '[:space:]' < public/CNAME)"; else host='${{ github.repository_owner }}.github.io'; fi
          {
            echo "url=https://${host}${base}"
            echo "short=$(git rev-parse --short HEAD)"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

  # Ten tasks in the app, driven in the viewers' Chromium, Firefox and WebKit
  # in turn, and again from the lines its console wrote in each: the shortest,
  # a quarter of an hour.
  parity:
    name: parity
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          viewers: 'true'
          browsers: chromium firefox webkit

      - name: Render the parity
        run: bash notebooks/scripts/memory.sh quarto render notebooks/parity.qmd

      # Whatever rendered, after a failure too.
      - name: Gather the page and the files beside it
        if: always()
        run: python3 notebooks/scripts/pages.py gather parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-parity-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          # A re-run of a failed attempt uploads under the same name.
          overwrite: true

  # The validation fetches the data, runs every analysis twice and writes the
  # command list the timings then run, on the same runner: the two in one job,
  # the timings after the validation, because no other runner holds the inputs
  # they run on.
  validation:
    name: validation and timings
    needs: site
    runs-on: ubuntu-24.04
    # GitHub's ceiling is 360; what is left over is for gathering the pages.
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
      TIMING_RUNS: ${{ inputs.runs || 4 }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          references: 'true'

      - name: Render the validation
        run: bash notebooks/scripts/memory.sh quarto render notebooks/validation.qmd

      - name: Render the timings, ${{ env.TIMING_RUNS }} runs of each command
        run: bash notebooks/scripts/memory.sh quarto render notebooks/timing.qmd

      # An hour of validation is worth keeping when the timings after it fail,
      # and the benchmark writes its table after every round, so the rounds it
      # finished are kept with it. `always()`, not `!cancelled()`, because the
      # likeliest failure is the timings outrunning the job's limit, and GitHub
      # cancels a job that does; copying files cannot hang.
      - name: Gather the pages and the files beside them
        if: always()
        run: python3 notebooks/scripts/pages.py gather validation timing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-validation-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          overwrite: true

  # The time to a picture: a map and a track in chromosomix, juicebox.js and
  # HiGlass, from the disk and from the bucket, on a runner of its own with the
  # viewers' own 15 GB. The driver writes each run as it finishes, so a render
  # that outruns the job keeps the pictures it timed.
  viewers:
    name: viewers
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
      VIEWER_RUNS: ${{ inputs.viewer_runs || 4 }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          viewers: 'true'
          higlass: 'true'

      - name: Render the viewers, ${{ env.VIEWER_RUNS }} rounds of pictures
        run: bash notebooks/scripts/memory.sh quarto render notebooks/viewers.qmd

      - name: Gather the page and the files beside it
        if: always()
        run: python3 notebooks/scripts/pages.py gather viewers

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-viewers-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          overwrite: true

  # 23 analyses run genome-wide, on the command line and in the app, on this
  # job's runner, with Playwright's Chromium, Firefox and WebKit for the app;
  # then six over the IMR-90 map, one after the other, by chromosomix and by
  # cooltools and coolpuppy from the reference environment. A render that
  # outruns the job keeps the runs it measured: each is written to the table as
  # it is, and gathered whatever happened.
  laptop:
    name: laptop
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
      PIPELINE_RUNS: ${{ inputs.pipeline_runs || 1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          viewers: 'true'
          browsers: chromium firefox webkit

      # The committed page is a render from a laptop, and the one the site
      # publishes. Out of the way, so that a render that fails before it writes
      # its page leaves this run's artifact without one rather than with that.
      - name: Set the committed page aside
        run: rm -f notebooks/laptop.html

      - name: Render the laptop, and ${{ env.PIPELINE_RUNS }} run of each side over the IMR-90 map
        run: bash notebooks/scripts/memory.sh quarto render notebooks/laptop.qmd

      # Each analysis is written to its table as it is measured, so a render
      # that failed part of the way keeps the ones it finished.
      - name: Gather the page and the files beside it
        if: always()
        run: python3 notebooks/scripts/pages.py gather laptop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-laptop-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          overwrite: true

  # Every page the workflow publishes, together or not at all, and the run's
  # summary in any case.
  publish:
    name: publish
    needs: [site, parity, validation, viewers, laptop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The `notebooks` branch, and a release's assets.
      contents: write
      # The deploy it asks for at the end.
      actions: write
    env:
      # The laptop's render is never published, so whether it rendered decides
      # nothing here; the summary still says.
      RENDERED: ${{ needs.parity.result == 'success' && needs.validation.result == 'success' && needs.viewers.result == 'success' }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notebooks/scripts

      # Nothing to download when every render failed before it gathered a
      # page; the summary still says so.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: notebooks-*-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages
          merge-multiple: true

      # One orphan commit, force-pushed: the branch's only interesting state is
      # its tip, and the deploy clones it on every push to `main`.
      - name: Publish to the notebooks branch
        id: publish
        if: env.RENDERED == 'true' && env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init --quiet --initial-branch "$NOTEBOOKS_BRANCH" published
          for page in $(python3 notebooks/scripts/pages.py published); do cp -R "pages/$page" published/; done
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --quiet -m 'notebooks: chromosomix ${{ needs.site.outputs.version }} at ${{ needs.site.outputs.short }}'
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$NOTEBOOKS_BRANCH"

      # The site keeps the newest pages only; the release keeps its own.
      - name: Attach the pages to the release
        if: env.RENDERED == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 notebooks/scripts/pages.py assets "$TAG" assets
          gh release upload "$TAG" assets/* --clobber --repo '${{ github.repository }}'

      # The publisher of the site, as stores.yml asks it. A run dispatched by the
      # workflow token is one of the two kinds GitHub delivers for that token.
      - name: Ask the deploy to publish the site
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref '${{ github.event.repository.default_branch || 'main' }}' --repo '${{ github.repository }}'

      # What the run page says, a section a notebook: where it is and from what,
      # the line of findings it wrote, and its table, folded.
      - name: Summary
        if: always()
        env:
          SITE: ${{ needs.site.outputs.url }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 notebooks/scripts/pages.py summary >> "$GITHUB_STEP_SUMMARY"
