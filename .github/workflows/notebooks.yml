name: Notebooks

# Renders the four notebooks that hold chromosomix to the packages it reproduces,
# to its own command line, and to a machine like a reader's (SPECS §18.10), and
# publishes three of them beside the app:
#
#   https://chromosomix.app/validation/   notebooks/validation.qmd — every
#                                         analysis run twice, by chromosomix and
#                                         by its reference, and lined up
#   https://chromosomix.app/timings/      notebooks/timing.qmd — a map and a
#                                         track drawn by chromosomix, juicebox.js
#                                         and HiGlass, timed; then every command
#                                         of the validation, run again and timed
#   https://chromosomix.app/parity/       notebooks/parity.qmd — ten tasks run
#                                         in the app in headless Chromium, then
#                                         from the line its console wrote, and
#                                         the files the two wrote compared
#
# The fourth, notebooks/laptop.qmd — 23 analyses run genome-wide, once each,
# with their time and peak memory — is meant for a laptop. The page at
# https://chromosomix.app/laptop/ is rendered by hand on one and committed as
# notebooks/laptop.html, and deploy.yml publishes that file. This workflow
# renders it on a runner too, keeps it as the run's artifact and writes it into
# the run's summary, and never publishes it: not to the branch, not to a
# release.
#
# **When.** On every release, once it is published — release.yml makes the
# release a draft from the tag and a person publishes it, and that act is what
# fires `release: published` (a draft fires nothing, and neither would a
# release made with the workflow token) — and by hand: Actions → Notebooks →
# Run workflow, on any branch or tag, with the number of timed runs and
# whether to publish. A run from a branch that publishes replaces the pages a
# release put up; untick *publish* to look at a branch's pages in the run's
# artifacts instead.
#
# **One job a notebook.** `site` works out where the pages will be, for the
# links between them. `parity` renders first, in about ten minutes, so that a
# page that cannot render fails the run before the hours of the others; then
# `validation` and `laptop` run side by side, each on a runner of its own.
# `laptop` takes the committed page out of the way first, so that what it
# gathers is its own render or nothing.
# The validation and the timings share a job because the timings run the
# validation's own commands again, on the inputs the validation fetched and
# made: about 6 GB that would otherwise go from one job to the next as an
# artifact on every run, which a private repository pays for. Each job
# installs what it needs through .github/actions/notebooks-setup, gathers its
# pages with notebooks/scripts/pages.py — the one table of where each page is
# published and which files go beside it — and keeps them as an artifact for
# 90 days, even when it fails: the validation alone, and the timing rounds it
# finished, when the timings are what failed. `publish` waits for all three,
# publishes the three pages it publishes only if every one of them rendered —
# the laptop's render, published or not, is not one — and writes the run's
# summary either way: each notebook's address, version and time, the one line
# of findings it wrote, and its table.
#
# **What it installs**, and why pinned. The references are the versions the
# notebooks' prose names: `notebooks/requirements.txt` is the reference
# environment as the last render by hand had it, every package pinned, on
# Python 3.13, and every notebook renders in it; `notebooks/requirements-yapc.txt`
# is yapc 0.1's, on Python 3.11, which needs a numpy from before 1.24, and IDR
# 2.0.3 and yapc are built from their repositories at the commits the notebook
# cites, as the yapc section of scripts/make_analysis_golden.py does. Boost-HiC
# is a checkout; bedtools and seqkit are Ubuntu 24.04's own packages, which are
# the versions the notebook was written against. Quarto comes with the reference
# environment, as the `quarto-cli` package. The viewers the timings open on are
# pinned in `notebooks/viewers/package.json` (juicebox.js, HiGlass and the
# Playwright that drives Chromium for all three, and for the parity), and
# HiGlass's tile server in `notebooks/requirements-higlass.txt`,
# higlass-python's environment, with Ubuntu's libfuse 2 for the files it reads
# from a bucket.
#
# **What it costs.** Every run fetches its data rather than caching them: about
# 6 GB for the validation (4DN's, UCSC's mm10 through iGenomes, and GEO's yeast
# Micro-C, each from where it was published) and 15 GB more for the viewers
# (4DN's chicken and mouse maps in both formats, the mouse's 13 GB of it, and
# the app's yeast demo); 160 MB for the parity (GEO's yeast Micro-C and
# ATAC-seq, UCSC's sacCer3); 13.7 GB for the laptop (the validation's mouse
# and yeast maps, ATAC-seq and mm10, and 4DN's 8.3 GB IMR-90 map). A cache
# that size would evict the repository's npm and Electron caches, and the
# buckets answer a runner at hundreds of megabytes a second. From nothing, the
# validation renders in about an hour on a standard runner, every reference run
# for the first time; the viewers' pictures in about twenty minutes a round, and the
# timings in about twenty minutes a run, so four of each fit the six hours a
# job may take — four, an even number, so that each side of a pair goes first
# in as many rounds as the other (timing.qmd's `round_of`), and as many as
# there are viewers, so that each goes first once a picture. The laptop takes
# about an hour, half of it peak calling over the whole mouse genome. Every
# runner is a different machine, which is why each page says which one it ran
# on.
#
# **What it runs on, and the memory.** A standard runner for a private
# repository has 2 cores and 8 GB, 7.8 of them the job's — not the 4 cores and
# 16 GB a public one has. A reference that takes a number of processes is
# given one a core, at most four (validation.qmd's `THREADS`). Given four on
# two cores, six renders in nine were shut down, four of them in the cell where
# cooltools computes the expected over the mouse genome at 10 kb, its largest
# process alone at 3.6 GB: by every sign the log leaves, the memory ran out.
# GitHub shuts down a runner whose memory runs out in the
# middle of a step, with "The runner has received a shutdown signal": the
# command reports no error, no step after it runs, `if: always()` or not, and
# nothing is gathered or uploaded. So every render runs through
# notebooks/scripts/memory.sh, which writes the memory in use and available
# and the three programs holding the most into the step's log every ten
# seconds — the log streamed until the shutdown being all that is left of it.
#
# **Where it is published, and why through a branch.** Pages replaces the
# whole site on every deployment and only deploy.yml deploys it, so this
# workflow does what stores.yml does: it force-pushes the three pages, and the
# files beside them, to an orphan `notebooks` branch as one commit, and asks
# deploy.yml to publish; the deploy copies them into `validation/`,
# `timings/` and `parity/` on every run after that, so a push to `main` keeps
# them. Which pages those are is `pages.py published`. Beside each page: `rendered.json`, what the stamp at its
# top says (when, from which commit and release, by which run, on what
# machine) and its line of findings; `commands.json`, `summary.tsv` and
# `validation.txt` beside the validation, every command it ran, every verdict
# and every number its figures draw, one row a mark (33 MB, most of it
# Boost-HiC's two maps of chr19 and the metaplot over two tracks);
# `timings.tsv` beside the timings, every timed run, one row each, and
# `viewers.tsv`, every picture timed in a viewer; `summary.tsv` beside the
# parity, every file the app and the command line wrote, and its verdict. A
# release also gets the three pages and the five tables as assets of its own —
# `validation-<tag>.tsv` and `.txt`, `timings-<tag>.tsv`, `viewers-<tag>.tsv`
# and `parity-<tag>.tsv` — so a release's numbers outlive the next release's
# pages; its laptop page is the one committed in its source.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runs:
        description: 'Timed runs of each command (timing.qmd); even, so each side of a pair goes first equally often'
        type: number
        default: 4
      viewer_runs:
        description: 'Rounds of the viewers’ pictures (timing.qmd); four, so each viewer goes first once a picture'
        type: number
        default: 4
      publish:
        description: 'Publish the pages at <site>/validation/, <site>/timings/ and <site>/parity/ (never the laptop’s)'
        type: boolean
        default: true

permissions: {}

# One writer of the branch, and never a render cancelled three hours in for a
# newer one: a second run waits for the first.
concurrency:
  group: notebooks
  cancel-in-progress: false

env:
  NOTEBOOKS_BRANCH: notebooks

jobs:
  # Where the site is, for the links between the pages and to the files beside
  # them — the same resolution as deploy.yml and preview.yml — and the version
  # and commit every artifact of the run is named after.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      url: ${{ steps.site.outputs.url }}
      short: ${{ steps.site.outputs.short }}
      version: ${{ steps.site.outputs.version }}
    steps:
      # On a release, the release's tag: what is rendered is what was released.
      - uses: actions/checkout@v4

      - name: Resolve the site
        id: site
        run: |
          override='${{ vars.BASE_PATH }}'
          repo='${{ github.event.repository.name }}'
          if [ -n "$override" ]; then
            base="$override"
          elif [ -f public/CNAME ] || [ "${repo%.github.io}" != "$repo" ]; then
            base='/'
          else
            base="/$repo/"
          fi
          if [ -f public/CNAME ]; then host="$(tr -d '[:space:]' < public/CNAME)"; else host='${{ github.repository_owner }}.github.io'; fi
          {
            echo "url=https://${host}${base}"
            echo "short=$(git rev-parse --short HEAD)"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

  # Ten tasks in the app, driven in the viewers' Chromium, and again from the
  # lines its console wrote; first, being the shortest.
  parity:
    name: parity
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          viewers: 'true'

      - name: Render the parity
        run: bash notebooks/scripts/memory.sh quarto render notebooks/parity.qmd

      # Whatever rendered, after a failure too.
      - name: Gather the page and the files beside it
        if: always()
        run: python3 notebooks/scripts/pages.py gather parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-parity-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          # A re-run of a failed attempt uploads under the same name.
          overwrite: true

  # The validation fetches the data, runs every analysis twice and writes the
  # command list the timings then run, on the same runner.
  validation:
    name: validation and timings
    needs: [site, parity]
    runs-on: ubuntu-24.04
    # GitHub's ceiling is 360; what is left over is for gathering the pages.
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
      TIMING_RUNS: ${{ inputs.runs || 4 }}
      VIEWER_RUNS: ${{ inputs.viewer_runs || 4 }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup
        with:
          viewers: 'true'
          references: 'true'
          higlass: 'true'

      - name: Render the validation
        run: bash notebooks/scripts/memory.sh quarto render notebooks/validation.qmd

      - name: Render the timings, ${{ env.VIEWER_RUNS }} rounds of pictures and ${{ env.TIMING_RUNS }} runs of each command
        run: bash notebooks/scripts/memory.sh quarto render notebooks/timing.qmd

      # An hour of validation is worth keeping when the timings after it fail,
      # and the benchmark writes its table after every round, so the rounds it
      # finished are kept with it. `always()`, not `!cancelled()`, because the
      # likeliest failure is the timings outrunning the job's limit, and GitHub
      # cancels a job that does; copying files cannot hang.
      - name: Gather the pages and the files beside them
        if: always()
        run: python3 notebooks/scripts/pages.py gather validation timing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-validation-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          overwrite: true

  # 23 analyses run genome-wide, once each, on this job's runner: the same
  # kind of machine as the timings', with no reference package beside them.
  laptop:
    name: laptop
    needs: [site, parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      NOTEBOOKS_SITE: ${{ needs.site.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/notebooks-setup

      # The committed page is a render from a laptop, and the one the site
      # publishes. Out of the way, so that a render that fails before it writes
      # its page leaves this run's artifact without one rather than with that.
      - name: Set the committed page aside
        run: rm -f notebooks/laptop.html

      - name: Render the laptop
        run: bash notebooks/scripts/memory.sh quarto render notebooks/laptop.qmd

      # Each analysis is written to its table as it is measured, so a render
      # that failed part of the way keeps the ones it finished.
      - name: Gather the page and the files beside it
        if: always()
        run: python3 notebooks/scripts/pages.py gather laptop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-laptop-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages/
          retention-days: 90
          overwrite: true

  # Every page the workflow publishes, together or not at all, and the run's
  # summary in any case.
  publish:
    name: publish
    needs: [site, parity, validation, laptop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The `notebooks` branch, and a release's assets.
      contents: write
      # The deploy it asks for at the end.
      actions: write
    env:
      # The laptop's render is never published, so whether it rendered decides
      # nothing here; the summary still says.
      RENDERED: ${{ needs.parity.result == 'success' && needs.validation.result == 'success' }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notebooks/scripts

      # Nothing to download when every render failed before it gathered a
      # page; the summary still says so.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: notebooks-*-${{ needs.site.outputs.version }}-${{ needs.site.outputs.short }}
          path: pages
          merge-multiple: true

      # One orphan commit, force-pushed: the branch's only interesting state is
      # its tip, and the deploy clones it on every push to `main`.
      - name: Publish to the notebooks branch
        id: publish
        if: env.RENDERED == 'true' && env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init --quiet --initial-branch "$NOTEBOOKS_BRANCH" published
          for page in $(python3 notebooks/scripts/pages.py published); do cp -R "pages/$page" published/; done
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --quiet -m 'notebooks: chromosomix ${{ needs.site.outputs.version }} at ${{ needs.site.outputs.short }}'
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$NOTEBOOKS_BRANCH"

      # The site keeps the newest pages only; the release keeps its own.
      - name: Attach the pages to the release
        if: env.RENDERED == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 notebooks/scripts/pages.py assets "$TAG" assets
          gh release upload "$TAG" assets/* --clobber --repo '${{ github.repository }}'

      # The publisher of the site, as stores.yml asks it. A run dispatched by the
      # workflow token is one of the two kinds GitHub delivers for that token.
      - name: Ask the deploy to publish the site
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref '${{ github.event.repository.default_branch || 'main' }}' --repo '${{ github.repository }}'

      # What the run page says, a section a notebook: where it is and from what,
      # the line of findings it wrote, and its table, folded.
      - name: Summary
        if: always()
        env:
          SITE: ${{ needs.site.outputs.url }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 notebooks/scripts/pages.py summary >> "$GITHUB_STEP_SUMMARY"
