name: Notebooks

# Renders the two notebooks that hold chromosomix to the packages it reproduces
# (SPECS §18.10) and publishes them beside the app:
#
#   https://chromosomix.app/validation/   notebooks/validation.qmd — every
#                                         analysis run twice, by chromosomix and
#                                         by its reference, and lined up
#   https://chromosomix.app/timings/      notebooks/timing.qmd — a map and a
#                                         track drawn by chromosomix, juicebox.js
#                                         and HiGlass, timed; then every command
#                                         of the first, run again and timed
#
# **When.** On every release, once it is published — release.yml makes the
# release a draft from the tag and a person publishes it, and that act is what
# fires `release: published` (a draft fires nothing, and neither would a
# release made with the workflow token) — and by hand: Actions → Notebooks →
# Run workflow, on any branch or tag, with the number of timed runs and
# whether to publish. A run from a branch that publishes replaces the pages a
# release put up; untick *publish* to look at a branch's pages in the run's
# artifact instead.
#
# **What it installs**, and why pinned. The references are the versions the
# notebooks' prose names: `notebooks/requirements.txt` is the reference
# environment as the last render by hand had it, every package pinned, on
# Python 3.13; `notebooks/requirements-yapc.txt` is yapc 0.1's, on Python
# 3.11, which needs a numpy from before 1.24, and IDR 2.0.3 and yapc are built
# from their repositories at the commits the notebook cites, as the yapc
# section of scripts/make_analysis_golden.py does. Boost-HiC is a checkout;
# bedtools and seqkit are Ubuntu 24.04's own packages, which are the versions
# the notebook was written against. Quarto comes with the reference
# environment, as the `quarto-cli` package. The viewers the timings open on are
# pinned in `notebooks/viewers/package.json` (juicebox.js, HiGlass and the
# Playwright that drives Chromium for all three), and HiGlass's tile server in
# `notebooks/requirements-higlass.txt`, higlass-python's environment, with
# Ubuntu's libfuse 2 for the files it reads from a bucket.
#
# **What it costs.** About 6 GB of public data (4DN's, UCSC's mm10 through
# iGenomes, and GEO's yeast Micro-C, each from where it was published) is
# fetched on every run rather than cached, and 15 GB more for the viewers (4DN's
# chicken and mouse maps in both formats, the mouse's 13 GB of it, and the
# app's yeast demo): a cache that size would evict the repository's npm and
# Electron caches, and the buckets answer a runner at hundreds of megabytes a
# second. From nothing, the validation renders in about an hour on a standard
# runner (4 cores, 16 GB — the heaviest reference peaks at about 4 GB), every
# reference run for the first time; the viewers' pictures in about twenty
# minutes a round, and the timings in about twenty minutes a run, so four of
# each fit the six hours a job may take — four, an even number, so that each
# side of a pair goes first in as many rounds as the other (timing.qmd's
# `round_of`), and as many as there are viewers, so that each goes first once
# a picture. Every runner is a different machine, which is why the timings page
# says which one it ran on.
#
# **Where it is published, and why through a branch.** Pages replaces the
# whole site on every deployment and only deploy.yml deploys it, so this
# workflow does what stores.yml does: it force-pushes the two pages, and the
# files beside them, to an orphan `notebooks` branch as one commit, and asks
# deploy.yml to publish; the deploy copies them into `validation/` and
# `timings/` on every run after that, so a push to `main` keeps them. Beside
# each page: `rendered.json`, what the stamp at its top says (when, from which
# commit and release, by which run, on what machine); `commands.json`,
# `summary.tsv` and `validation.txt` beside the validation, every command it
# ran, every verdict and every number its figures draw, one row a mark (33 MB,
# most of it Boost-HiC's two maps of chr19 and the metaplot over two tracks);
# `timings.tsv` beside the timings, every timed run, one row each, and
# `viewers.tsv`, every picture timed in a viewer. A release also gets the two
# pages and the four tables as assets of its own — every verdict as
# `validation-<tag>.tsv`, every number its figures draw as
# `validation-<tag>.txt`, every timed run as `timings-<tag>.tsv` and every
# picture as `viewers-<tag>.tsv` — so a release's numbers outlive the next
# release's pages. Every run keeps what it
# rendered as an artifact for 90 days, even when it fails: the validation alone,
# and the timing rounds it finished, when the timings are what failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runs:
        description: 'Timed runs of each command (timing.qmd); even, so each side of a pair goes first equally often'
        type: number
        default: 4
      viewer_runs:
        description: 'Rounds of the viewers’ pictures (timing.qmd); four, so each viewer goes first once a picture'
        type: number
        default: 4
      publish:
        description: 'Publish the pages at <site>/validation/ and <site>/timings/'
        type: boolean
        default: true

permissions: {}

# One writer of the branch, and never a render cancelled three hours in for a
# newer one: a second run waits for the first.
concurrency:
  group: notebooks
  cancel-in-progress: false

env:
  NOTEBOOKS_BRANCH: notebooks

jobs:
  render:
    name: render and publish
    runs-on: ubuntu-24.04
    # GitHub's ceiling is 360; what is left over is for publishing.
    timeout-minutes: 350
    permissions:
      # The `notebooks` branch, and a release's assets.
      contents: write
      # The deploy it asks for at the end.
      actions: write
    env:
      TIMING_RUNS: ${{ inputs.runs || 4 }}
      VIEWER_RUNS: ${{ inputs.viewer_runs || 4 }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      # The data, their outputs and three Python environments need about 15 GB,
      # and the viewers' files 15 GB more; a fresh runner has about half of
      # that free. Toolchains and browsers this job never uses are what make
      # the room — the viewers run in Playwright's own Chromium.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /opt/microsoft /opt/google /usr/lib/jvm /opt/az \
            /usr/local/julia* /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # On a release, the release's tag: what is rendered is what was released.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Where the site is, for the links between the two pages and to the files
      # beside them — the same resolution as deploy.yml and preview.yml.
      - name: Resolve the site
        id: site
        run: |
          override='${{ vars.BASE_PATH }}'
          repo='${{ github.event.repository.name }}'
          if [ -n "$override" ]; then
            base="$override"
          elif [ -f public/CNAME ] || [ "${repo%.github.io}" != "$repo" ]; then
            base='/'
          else
            base="/$repo/"
          fi
          if [ -f public/CNAME ]; then host="$(tr -d '[:space:]' < public/CNAME)"; else host='${{ github.repository_owner }}.github.io'; fi
          {
            echo "url=https://${host}${base}"
            echo "short=$(git rev-parse --short HEAD)"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      # The command-line form of the app's Analysis panel, typechecked first, and
      # the app itself, which the viewers' timings serve from dist/.
      - name: Build chromosomix
        run: |
          npm run build:cli
          npm run build

      # libfuse 2, which higlass-python's FUSE mount (fusepy) loads to serve a
      # file from a bucket, with its fusermount.
      - name: bedtools, seqkit and FUSE
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bedtools seqkit fuse libfuse2t64
          bedtools --version
          seqkit version
          fusermount -V

      # juicebox.js, HiGlass and Playwright at the versions the timings name, and
      # the Chromium that Playwright drives, with what it needs from Ubuntu.
      - name: The viewers and their browser
        run: |
          npm ci --prefix notebooks/viewers
          npx --prefix notebooks/viewers playwright install --with-deps chromium

      # yapc's first, so that the reference environment's 3.13 is the one left
      # on the PATH.
      - uses: actions/setup-python@v5
        id: python311
        with:
          python-version: '3.11'

      - uses: actions/setup-python@v5
        id: python313
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: notebooks/requirements*.txt

      - name: Where the environments go
        run: |
          {
            echo "REFS=$RUNNER_TEMP/refs"
            echo "QUARTO_PYTHON=$RUNNER_TEMP/refs/bin/python"
            echo "YAPC_PYTHON=$RUNNER_TEMP/yapc-env/bin/python"
            echo "BOOSTHIC_DIR=$RUNNER_TEMP/Boost-HiC"
            echo "HIGLASS_PYTHON=$RUNNER_TEMP/higlass-env/bin/python"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/refs/bin" >> "$GITHUB_PATH"

      - name: The reference packages
        run: |
          set -euo pipefail
          '${{ steps.python313.outputs.python-path }}' -m venv "$REFS"
          "$REFS/bin/pip" install --quiet --upgrade pip
          "$REFS/bin/pip" install --quiet -r notebooks/requirements.txt
          "$REFS/bin/pip" check
          "$REFS/bin/quarto" --version

      # The recipe in the yapc section of scripts/make_analysis_golden.py:
      # IDR's generated `inv_cdf.c` predates Python 3.11, and Cython regenerates
      # a `.c` only when it is older than its `.pyx`, so it goes before the build.
      - name: yapc and IDR, in an environment of their own
        run: |
          set -euo pipefail
          '${{ steps.python311.outputs.python-path }}' -m venv "$RUNNER_TEMP/yapc-env"
          pip="$RUNNER_TEMP/yapc-env/bin/pip"
          "$pip" install --quiet -r notebooks/requirements-yapc.txt
          git clone --quiet https://github.com/nboley/idr "$RUNNER_TEMP/idr"
          git -C "$RUNNER_TEMP/idr" checkout --quiet 74665e73bffb689a440948640c386b1188eea1e3
          rm "$RUNNER_TEMP/idr/idr/inv_cdf.c"
          "$pip" install --quiet --no-build-isolation "$RUNNER_TEMP/idr"
          "$pip" install --quiet --no-deps 'git+https://github.com/jurgjn/yapc@cf2ea62694f082fc282a979057d44b5e5b0fb41a'
          "$RUNNER_TEMP/yapc-env/bin/yapc" --help > /dev/null

      # HiGlass's tile server, as higlass-python starts one, in an environment of
      # its own: its pins (numpy 2, a newer h5py) are not the references'.
      - name: higlass-python, in an environment of its own
        run: |
          set -euo pipefail
          '${{ steps.python313.outputs.python-path }}' -m venv "$RUNNER_TEMP/higlass-env"
          "$RUNNER_TEMP/higlass-env/bin/pip" install --quiet -r notebooks/requirements-higlass.txt
          "$RUNNER_TEMP/higlass-env/bin/pip" check
          "$HIGLASS_PYTHON" -c 'import higlass, clodius, simple_httpfs, fuse'

      - name: Boost-HiC
        run: |
          git clone --quiet https://github.com/LeopoldC/Boost-HiC "$BOOSTHIC_DIR"
          git -C "$BOOSTHIC_DIR" checkout --quiet a615aff7aa53a8370051a6366d893d6c03440906

      # Fetches the data, runs every analysis twice and writes the command list
      # the timings run from. NOTEBOOKS_SITE is what makes each page link to the
      # other, and to the files beside it, where they are published.
      - name: Render the validation
        env:
          NOTEBOOKS_SITE: ${{ steps.site.outputs.url }}
        run: quarto render notebooks/validation.qmd

      - name: Render the timings, ${{ env.VIEWER_RUNS }} rounds of pictures and ${{ env.TIMING_RUNS }} runs of each command
        env:
          NOTEBOOKS_SITE: ${{ steps.site.outputs.url }}
        run: quarto render notebooks/timing.qmd

      # Whatever rendered, after a failure too: an hour of validation is worth
      # keeping when the timings after it fail, and the benchmark writes its
      # table after every round, so the rounds it finished are kept with it.
      # `always()`, not `!cancelled()`, because the likeliest failure is the
      # timings outrunning the job's limit, and GitHub cancels a job that does;
      # copying files cannot hang. Publishing, below, still needs both pages.
      - name: Gather the pages and the files beside them
        if: always()
        run: |
          set -euo pipefail
          work=notebooks/work/validation
          if [ -f notebooks/validation.html ]; then
            mkdir -p pages/validation
            cp notebooks/validation.html pages/validation/index.html
            cp "$work/rendered-validation.json" pages/validation/rendered.json
            cp "$work/commands.json" "$work/summary.tsv" "$work/validation.txt" pages/validation/
          fi
          if [ -f notebooks/timing.html ]; then
            mkdir -p pages/timings
            cp notebooks/timing.html pages/timings/index.html
            cp "$work/rendered-timing.json" pages/timings/rendered.json
          fi
          for table in timings.tsv viewers.tsv; do
            if [ -f "$work/$table" ]; then
              mkdir -p pages/timings
              cp "$work/$table" pages/timings/
            fi
          done
          if [ -d pages ]; then du -ah pages; else echo 'Neither notebook rendered.'; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks-${{ steps.site.outputs.version }}-${{ steps.site.outputs.short }}
          path: pages/
          retention-days: 90
          # A re-run of a failed attempt uploads under the same name.
          overwrite: true

      # One orphan commit, force-pushed: the branch's only interesting state is
      # its tip, and the deploy clones it on every push to `main`.
      - name: Publish to the notebooks branch
        id: publish
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init --quiet --initial-branch "$NOTEBOOKS_BRANCH" published
          cp -R pages/validation pages/timings published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --quiet -m 'notebooks: chromosomix ${{ steps.site.outputs.version }} at ${{ steps.site.outputs.short }}'
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$NOTEBOOKS_BRANCH"

      # The site keeps the newest pages only; the release keeps its own.
      - name: Attach the pages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cp pages/validation/index.html "assets/validation-${TAG}.html"
          cp pages/timings/index.html "assets/timings-${TAG}.html"
          cp pages/validation/summary.tsv "assets/validation-${TAG}.tsv"
          cp pages/validation/validation.txt "assets/validation-${TAG}.txt"
          cp pages/timings/timings.tsv "assets/timings-${TAG}.tsv"
          cp pages/timings/viewers.tsv "assets/viewers-${TAG}.tsv"
          gh release upload "$TAG" assets/* --clobber --repo '${{ github.repository }}'

      # The publisher of the site, as stores.yml asks it. A run dispatched by the
      # workflow token is one of the two kinds GitHub delivers for that token.
      - name: Ask the deploy to publish the site
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref '${{ github.event.repository.default_branch || 'main' }}' --repo '${{ github.repository }}'

      # What the run page says: where the pages are, from what, and every verdict.
      - name: Summary
        if: always()
        env:
          SITE: ${{ steps.site.outputs.url }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json, os, pathlib
          work = pathlib.Path('notebooks/work/validation')
          site = os.environ['SITE']
          print('## Notebooks\n')
          for page, path in (('validation', 'validation/'), ('timing', 'timings/')):
              stamp = work / f'rendered-{page}.json'
              if not stamp.exists():
                  print(f'- **{path[:-1]}**: not rendered')
                  continue
              facts = json.loads(stamp.read_text())
              where = f'[{site}{path}]({site}{path})' if os.environ['PUBLISHED'] == 'true' else 'not published'
              c = facts['chromosomix']
              print(f"- **{path[:-1]}**: {where} · chromosomix {c['version']} at `{(c['commit'] or '')[:7]}`"
                    + (f", release {c['tag']}" if c['tag'] else '')
                    + f" · rendered in {facts['seconds'] // 60} min, finished {facts['finished']}")
          verdicts = work / 'summary.tsv'
          if verdicts.exists():
              rows = list(csv.DictReader(verdicts.open(), delimiter='\t'))
              print('\n| § | Analysis | Reference | Verdict |\n|---|---|---|---|')
              for row in rows:
                  print(f"| {row['§']} | {row['Analysis']} | {row['Reference']} | {row['Verdict']} |")
          PY
