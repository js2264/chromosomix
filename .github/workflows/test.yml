name: Tests

# There was no test job at all until now, only the Pages deploy — so on a fresh
# clone nothing verified the goldens, the /bins guard or the request budgets,
# and a regression could reach `main` silently.
#
# The suite splits in two, because half of it needs data that is not in the
# repo. `test/fixtures/` is generated by `npm run fixtures`, which drives the
# **Python** metacooler package; `test/golden/` (the oracles it is compared
# against) is committed. So:
#
#   - `test:nofixtures` runs everywhere, on every push. It is the half a
#     contributor can verify without a Python environment.
#   - the full suite runs when metacooler can be installed, which is where the
#     golden comparison — the thing that actually proves this reader agrees with
#     Python — happens.
#
# The second job is allowed to report "skipped" rather than to fail the build if
# metacooler is not installable from this runner, because a red badge that means
# "we could not get the fixtures" trains people to ignore the badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, build and fixture-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests that need no fixtures
        run: npm run test:nofixtures
      - name: Build
        run: npm run build

      # The desktop *bundle*, not the installers: this compiles the renderer and
      # the main process and asserts the shape of what came out. No Electron
      # binary is downloaded and nothing is packaged, so PR time is unchanged —
      # `release.yml` is where the ~100 MB per platform gets fetched.
      #
      # Here rather than only on a tag because everything it catches is a source
      # change: a root-absolute asset URL, a worker URL built from the root, a
      # main process that no longer compiles. Finding those on the tag means
      # finding them at the moment a release is least able to absorb it.
      - name: Build the desktop bundle
        run: npm run build:desktop

  goldens:
    name: golden oracles (needs metacooler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      # Not fatal: this job proves the JS agrees with Python when Python is
      # available, and says so plainly when it is not.
      - name: Install metacooler
        id: python
        continue-on-error: true
        run: python -m pip install metacooler cooler

      - name: Generate fixtures
        id: fixtures
        if: steps.python.outcome == 'success'
        continue-on-error: true
        run: npm run fixtures

      - name: Full suite, against the Python oracles
        if: steps.fixtures.outcome == 'success'
        run: npm test

      - name: Report a skip rather than a pass
        if: steps.fixtures.outcome != 'success'
        run: |
          echo "::warning title=Goldens not verified::metacooler could not be installed or the fixtures could not be generated, so the golden comparison did not run. The fixture-free half of the suite still ran in the 'check' job."
