name: Tests

# Four jobs side by side on every push to `main` and every pull request, each
# named for what it holds, and a fifth on `main`:
#
#   build     the typecheck, the site's build and the desktop bundle
#   test      every suite, over every fixture and oracle it reads
#   widgets   the Jupyter and R widgets
#   docs      the documentation site, every internal link checked
#   coverage  on a push to `main`, the test job's coverage report published
#
# **Every fixture, on every run.** `test/fixtures/` is not committed: the test
# job builds it with the Python packages the app is held to, every one from
# PyPI — metacooler, whose CLI writes the .metacool and .mmetacool fixtures;
# cooler, which writes the coolers and reads back the oracles in `test/golden/`;
# cooltools, which reprocesses the demo yeast Micro-C for the subsample and
# normalisation suites; g3dtools, which writes the binary g3d containers. The
# inputs metacooler's fixtures are made from are its own test data, unpacked
# from the installed release's sdist (`scripts/fetch_metacooler_data.py`). It
# used to need a token and a checkout of metacooler's private repository, and
# split the suite in two to run what it could without them; with metacooler
# public, the job builds everything or fails, and runs the suite once.
#
# Every vitest run here is `--mode dev`: the tests of the dev features (SPECS
# §29), which a plain `npm test` leaves out (test/support/suites.ts), run on
# every push like the rest, because a dev feature is tested like any other.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two minutes, so a tree that does not compile is red long before the suite
  # would say so.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

      # The desktop *bundle*, not the installers: this compiles the renderer and
      # the main process and asserts the shape of what came out. No Electron
      # binary is downloaded and nothing is packaged, so PR time is unchanged —
      # `release.yml` is where the ~100 MB per platform gets fetched.
      #
      # Here rather than only on a tag because everything it catches is a source
      # change: a root-absolute asset URL, a worker URL built from the root, a
      # main process that no longer compiles. Finding those on the tag means
      # finding them at the moment a release is least able to absorb it.
      - name: Build the desktop bundle
        run: npm run build:desktop

  test:
    runs-on: ubuntu-latest
    # Whether the suite ran and passed, which is what `coverage` below publishes
    # from: a figure from a red suite is not the app's.
    outputs:
      coverage: ${{ steps.suite.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci

      # cooler from 0.11, the first whose `balance` counts a pixel on the main
      # diagonal once in a bin's marginal, as the dense block the app normalises
      # does: one round of an older one is not the app's VC. Biopython is for
      # the last step of metacooler's data generator, which digests its
      # assemblies with `cooler.util.digest`.
      - name: Install metacooler, cooler, cooltools and g3dtools
        run: python -m pip install metacooler 'cooler>=0.11' cooltools g3dtools biopython

      # The installed release's tests/data, from its sdist on PyPI, with the
      # contact lists the sdist leaves out written again by its own seeded
      # generator and held to the coolers metacooler built from the originals.
      - name: Fetch metacooler's test data
        run: npm run fixtures:metacooler

      # `fixtures` is metacooler's fixtures and their oracles, the .scool and the
      # HiC-Pro ones; `fixtures:reprocessed` is the demo yeast Micro-C as cooler
      # and cooltools reprocess it — `cooltools random-sample --exact`, `cooler
      # balance`, `cooler coarsen`, cooltools' iterative correction — for the
      # subsample and normalisation suites (SPECS §6.4, §6.5, §7.5). None of it
      # is committed, so a release of any of these packages that disagrees with
      # the app is found on the run that installed it.
      - name: Build the fixtures
        run: |
          npm run fixtures
          npm run fixtures:pairs
          npm run fixtures:g3d
          npm run fixtures:reprocessed

      # From the bucket and not from `demo/`, so a map that changed or vanished
      # there is found here rather than by a reader of the published store. A
      # bucket that does not answer is not the pull request's fault: the maps
      # are copied from `demo/` then, and the run says so.
      - name: Fetch the demo maps from the public bucket
        run: |
          if ! npm run fixtures:demo -- --from s3; then
            echo "::warning title=Demo maps not fetched::the demo maps could not be fetched from the public bucket; they were copied from demo/, so the bucket was not checked in this run."
            npm run fixtures:demo
          fi

      # The committed demo goldens are rebuilt by the public package and should
      # come out byte for byte the same: a cooler release that reads these maps
      # differently is a finding, named here, rather than something absorbed.
      - name: Rebuild the demo oracles with cooler
        run: |
          npm run fixtures:demo-golden -- --maps test/fixtures/demo
          if ! git diff --exit-code --stat -- test/golden/demo; then
            echo "::warning title=Demo oracles drifted::rebuilding test/golden/demo with this cooler did not reproduce the committed files; run npm run fixtures:demo-golden and look at the diff."
          fi

      # Measured over the whole app, not over the files the suite loads
      # (vitest.config.ts).
      - name: Every suite
        id: suite
        run: npm test -- --coverage --mode dev

      # The badge goes in the report's directory, so the artifact below carries
      # both to the `coverage` job.
      - name: Coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs --title 'full suite' --badge coverage/badge.json
      - name: Keep the coverage report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-full
          path: coverage/
          retention-days: 14

  # The notebook widgets (SPECS §21.5): the Python package under `widgets/python`
  # and the R package under `widgets/r`. Neither needs the app built — each test
  # suite holds what its widget hands the frame and what its file server answers
  # — so they run on their own, beside the app's.
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The Jupyter widget's tests
        run: |
          python -m pip install -e widgets/python pytest
          python -m pytest -q widgets/python/tests
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: widgets/r
          extra-packages: any::rcmdcheck
          needs: check
      - name: The R widget's check and tests
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: widgets/r
          args: 'c("--no-manual")'
          error-on: '"warning"'

  # The documentation site (SPECS §32): built as main's copy is, but at the root,
  # which is the one place its link checker runs — every internal link of every
  # page, generated or written, to a page or a heading that exists. It reads
  # the app's source (`scripts/docs-data.mjs`), so a task added to the registry
  # without a page, a token the theme reads that the stylesheet dropped, or a
  # validation section a task cites that the notebook lost, fails here.
  # `.github/workflows/docs.yml` publishes it; nothing here does.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            documentation/package-lock.json
      # The site reads the app's source through Vite, and nothing an install
      # script fetches (Electron's binary) is any part of that.
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix documentation
      - name: Build the site, every internal link checked
        run: npm run docs:build
      - name: Every page written
        run: |
          if grep -rln 'TODO(docs)' documentation/src/content/docs; then
            echo "::error title=Unwritten pages::the pages above are still marked TODO(docs)"
            exit 1
          fi

  # The suite's coverage, published at `<site>/coverage/` — the report, and the
  # `badge.json` the README's badge is drawn from — on the terms the stores and
  # the notebooks are (docs/deploy.md): Pages replaces the whole site on every
  # deployment and only deploy.yml deploys it, so this force-pushes the report
  # to an orphan `coverage` branch as one commit and asks for a deploy, which
  # copies the branch into `coverage/` then and on every run after.
  #
  # A job of its own so that the one holding a token that can write runs none
  # of the code under test, only what the test job left in its artifact. Only a
  # push to `main` publishes: a pull request's coverage is in its run's summary
  # and its artifact, and is not the site's.
  coverage:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The `coverage` branch.
      contents: write
      # The deploy it asks for at the end.
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-full
          path: report

      # One orphan commit, force-pushed: the branch's only interesting state is
      # its tip, and the deploy clones it on every push to `main`.
      - name: Publish to the coverage branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s report/index.html && test -s report/badge.json
          short=$(echo '${{ github.sha }}' | cut -c1-7)
          cd report
          git init --quiet --initial-branch coverage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --quiet -m "coverage: full suite at $short, $(jq -r .message badge.json) of lines"
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/coverage

      # The publisher of the site, as stores.yml and notebooks.yml ask it. A run
      # dispatched by the workflow token is one of the two kinds GitHub delivers
      # for that token.
      - name: Ask the deploy to publish the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo '${{ github.repository }}'
