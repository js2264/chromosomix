name: Tests

# There was no test job at all until now, only the Pages deploy — so on a fresh
# clone nothing verified the goldens, the /bins guard or the request budgets,
# and a regression could reach `main` silently.
#
# The suite splits in two, because half of it needs data that is not in the
# repo. `test/fixtures/` is generated by `npm run fixtures`, which drives the
# **Python** metacooler package; `test/golden/` (the oracles it is compared
# against) is committed. So:
#
#   - `test:nofixtures` runs everywhere, on every push. It is the half a
#     contributor can verify without a Python environment. The published demo
#     maps join it (`npm run fixtures:demo`, copied from `demo/` here), so the
#     reader is compared with `cooler` on files metacooler really wrote on every
#     push, not only when the second job can build fixtures.
#   - the second job builds every oracle a runner can build. Its public half
#     needs no credential: the demo maps fetched from the lab's bucket and their
#     oracles rebuilt with the public `cooler` package, and the fixtures `cooler`
#     and `g3dtools` alone can write. Its private half is the full suite over
#     `make_fixtures.py`'s output, which needs metacooler — not on PyPI, and a
#     private repository, so it is checked out with the METACOOLER_REPO_TOKEN
#     secret (a fine-grained token with read access to js2264/metacooler's
#     contents) and skipped, with a warning saying so, where that is not set.
#
# Every step that installs, fetches or generates is allowed to fail without
# failing the build, and the job says plainly in its summary what did not run,
# because a red badge that means "we could not get the fixtures" trains people
# to ignore the badge. That used to mean the job was green while it compared
# nothing: `pip install metacooler` failed on every run. The test steps
# themselves are never allowed to fail quietly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, build and fixture-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Copied from `demo/` in this checkout, verified against the size and MD5
      # the golden was built from; the bucket is the fallback should `demo/`
      # ever leave the repository.
      - name: Put the demo maps in place
        run: npm run fixtures:demo
      - name: Tests that need no fixtures
        run: npm run test:nofixtures
      - name: Build
        run: npm run build

      # The desktop *bundle*, not the installers: this compiles the renderer and
      # the main process and asserts the shape of what came out. No Electron
      # binary is downloaded and nothing is packaged, so PR time is unchanged —
      # `release.yml` is where the ~100 MB per platform gets fetched.
      #
      # Here rather than only on a tag because everything it catches is a source
      # change: a root-absolute asset URL, a worker URL built from the root, a
      # main process that no longer compiles. Finding those on the tag means
      # finding them at the moment a release is least able to absorb it.
      - name: Build the desktop bundle
        run: npm run build:desktop

  goldens:
    name: golden oracles (cooler, the demo bucket and, with a token, metacooler)
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in an `if:`, so its presence travels in env.
      HAS_METACOOLER_TOKEN: ${{ secrets.METACOOLER_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      # ---------------------------------------------------------------------
      # The public half: no credential, every run.
      # ---------------------------------------------------------------------

      - name: Install cooler and g3dtools
        id: cooler
        continue-on-error: true
        run: python -m pip install cooler g3dtools

      # From the bucket and not from `demo/`, so a map that changed or vanished
      # there is found here rather than by a reader of the published store.
      - name: Fetch the demo maps from the public bucket
        id: demo
        continue-on-error: true
        run: npm run fixtures:demo -- --from s3

      # The committed demo goldens are rebuilt by the public package and must
      # come out byte for byte the same: a cooler release that reads these maps
      # differently is a finding, not something to absorb silently.
      - name: Rebuild the demo oracles with cooler
        id: demo-golden
        if: steps.cooler.outcome == 'success' && steps.demo.outcome == 'success'
        continue-on-error: true
        run: |
          npm run fixtures:demo-golden -- --maps test/fixtures/demo
          git diff --exit-code -- test/golden/demo

      - name: The demo maps against their oracles
        if: steps.demo.outcome == 'success'
        run: npx vitest run test/unit/demo-maps.test.ts

      - name: Build the fixtures cooler and g3dtools can write
        id: public-fixtures
        if: steps.cooler.outcome == 'success'
        continue-on-error: true
        run: |
          npm run fixtures:scool
          npm run fixtures:hicpro
          npm run fixtures:pairs
          npm run fixtures:g3d

      # ---------------------------------------------------------------------
      # The private half: metacooler's own repository, with a read token.
      # ---------------------------------------------------------------------

      - name: Check out metacooler
        id: metacooler
        if: env.HAS_METACOOLER_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: js2264/metacooler
          ref: devel
          path: metacooler
          token: ${{ secrets.METACOOLER_REPO_TOKEN }}

      - name: Install metacooler
        id: python
        if: steps.metacooler.outcome == 'success'
        continue-on-error: true
        run: python -m pip install ./metacooler cooler

      - name: Generate fixtures
        id: fixtures
        if: steps.python.outcome == 'success'
        continue-on-error: true
        env:
          METACOOLER_TEST_DATA: ${{ github.workspace }}/metacooler/tests/data
        run: npm run fixtures

      - name: Full suite, against the Python oracles
        if: steps.fixtures.outcome == 'success'
        run: npm test

      # Without metacooler the full suite cannot run, but the suites the public
      # fixtures feed can — each of them skips by name in the always-on job.
      - name: The suites the public fixtures feed
        if: steps.fixtures.outcome != 'success' && steps.public-fixtures.outcome == 'success'
        run: >-
          npx vitest run
          test/unit/scool.test.ts test/unit/hicpro.test.ts
          test/unit/pairs-cload-oracle.test.ts test/unit/pairs-mcool-roundtrip.test.ts
          test/unit/g3d-binary-oracle.test.ts test/unit/g3d-binary-worker.test.ts
          test/unit/msgpack.test.ts test/dom/error-view.test.ts

      - name: Report what ran and what did not
        if: always()
        env:
          COOLER: ${{ steps.cooler.outcome }}
          DEMO: ${{ steps.demo.outcome }}
          DEMO_GOLDEN: ${{ steps.demo-golden.outcome }}
          PUBLIC_FIXTURES: ${{ steps.public-fixtures.outcome }}
          METACOOLER: ${{ steps.metacooler.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
        run: |
          {
            echo "| oracle | outcome |"
            echo "|---|---|"
            echo "| cooler + g3dtools installed | ${COOLER} |"
            echo "| demo maps fetched from the bucket | ${DEMO} |"
            echo "| demo oracles rebuilt identically | ${DEMO_GOLDEN} |"
            echo "| fixtures built by cooler / g3dtools | ${PUBLIC_FIXTURES} |"
            echo "| metacooler checked out (METACOOLER_REPO_TOKEN) | ${METACOOLER:-skipped} |"
            echo "| metacooler fixtures, full suite | ${FIXTURES:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FIXTURES" != "success" ]; then
            echo "::warning title=Full suite not run::metacooler's fixtures were not built (set the METACOOLER_REPO_TOKEN secret to a token that can read js2264/metacooler), so the twelve reader suites over them and the metacool request budgets did not run. The demo maps and the public fixtures still did, where their own steps say so."
          fi
          if [ "$PUBLIC_FIXTURES" != "success" ]; then
            echo "::warning title=Public fixtures not built::cooler or g3dtools did not build their fixtures, so the .pairs (cooler cload pairs) and binary g3d oracles did not run in this job, nor the .scool and HiC-Pro ones unless metacooler's fixtures rebuilt them. Run npm run fixtures:scool, fixtures:hicpro, fixtures:pairs and fixtures:g3d and look at the error."
          fi
          if [ "$DEMO" != "success" ]; then
            echo "::warning title=Demo maps not fetched::the demo maps could not be fetched from the public bucket, so the reader was not compared with cooler on them in this job."
          fi
          if [ "$DEMO_GOLDEN" != "success" ] && [ "$DEMO" = "success" ] && [ "$COOLER" = "success" ]; then
            echo "::warning title=Demo oracles drifted::rebuilding test/golden/demo with this cooler did not reproduce the committed files; run npm run fixtures:demo-golden and look at the diff."
          fi
