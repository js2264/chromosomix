name: Deploy to GitHub Pages

# The viewer is a static bundle with no backend (SPECS C1), so publishing it is
# just "build and upload the directory". Data files are never part of it: they
# live on a bucket configured per docs/hosting.md.
#
# What is published is two things, not one: the site, at the root, and a copy of
# this build under `v/<commit>/` beside the copies previous pushes left there.
# That is what the version dropdown in the about dialog offers, and the whole of
# how it works is in docs/deploy.md under "Every push stays reachable".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Let a newer commit cancel an in-flight build, but never a deployment that has
# already started — a half-published site is worse than a stale one. It is also
# what keeps the archive branch to one writer: two jobs merging a manifest at
# once would each publish a list missing the other's build.
concurrency:
  group: pages
  cancel-in-progress: false

# The branch the archived builds live on. It is storage and nothing else: Pages
# is still deployed from the artifact this workflow uploads, so the repository's
# Pages source stays "GitHub Actions" and there is no setting to change.
env:
  ARCHIVE_BRANCH: pages-archive
  STORES_BRANCH: stores
  NOTEBOOKS_BRANCH: notebooks

jobs:
  build:
    runs-on: ubuntu-latest
    # Only this job writes, and it writes one branch. Previously both jobs held
    # all three permissions; the deploy job now keeps only what it deploys with.
    # `pull-requests: read` is for the preview reconciliation below — asking
    # which pull requests are still open, never writing to one.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Vite writes asset URLs at build time, so the sub-path the site will be
      # served from has to be known now. A project site lives under
      # /<repo>/; a user or org site (<name>.github.io) and any custom domain
      # live at the root. Set the BASE_PATH repository variable to override.
      - name: Resolve base path
        id: base
        run: |
          override='${{ vars.BASE_PATH }}'
          repo='${{ github.event.repository.name }}'
          if [ -n "$override" ]; then
            base="$override"
          elif [ -f public/CNAME ] || [ "${repo%.github.io}" != "$repo" ]; then
            base='/'
          else
            base="/$repo/"
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"
          echo "Building with base $base"

      # `git rev-parse --short`, not `github.sha` and not its first seven
      # characters: this string is a directory name *and* the value the bundle
      # reports about itself, because vite.config.ts asks git the same question.
      # Two spellings of one commit would publish a build the version picker
      # cannot find itself in.
      - name: Resolve this commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # `npm run build` typechecks first, so a type error fails the deploy
      # rather than publishing a bundle that no longer matches the source.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          # The site's registrations with Google and Dropbox, as repository
          # variables (docs/deploy.md). None is a secret; all end up in the page.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}

      # The same source again, for the copy that stays reachable after the next
      # push. No typecheck: the build above already ran one over this tree, and
      # a second would spend a minute answering a question already answered.
      - name: Build this commit's archived copy
        run: npm run build:pinned
        env:
          PINNED_BASE: ${{ steps.base.outputs.path }}v/${{ steps.commit.outputs.short }}/
          # The site's registrations with Google and Dropbox, as repository
          # variables (docs/deploy.md). None is a secret; all end up in the page.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}

      # Shallow, because only the tip of the archive branch is of interest here,
      # and because a full clone of a repository carrying 250 MB of demo data in
      # its history is not a thing to do on every push. Pushing a commit from a
      # shallow checkout is fine: its parent is the tip the remote already has.
      - name: Fetch the archive of past builds
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" "$ARCHIVE_BRANCH" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$ARCHIVE_BRANCH" "$remote" archive
          else
            echo "No $ARCHIVE_BRANCH branch yet — starting one."
            mkdir archive
            git -C archive init --quiet --initial-branch "$ARCHIVE_BRANCH"
            git -C archive remote add origin "$remote"
          fi

      # Every build on the archive branch was built for the address the site had
      # when it was pushed, with that base baked into each asset URL. When the
      # site moves — `public/CNAME` puts it at the root of its own domain, a
      # rename or `BASE_PATH` moves the sub-path — each of them would be a blank
      # page at its new address. This rewrites the ones whose base is not the
      # site's, previews included; on every other deploy it finds nothing to do,
      # and the archive branch keeps the result, so a move is rewritten once.
      - name: Move the archived builds to the site's base
        run: node scripts/archive-rebase.mjs archive '${{ steps.base.outputs.path }}'

      # The generated stores, which stores.yml keeps on a branch of their own and
      # the viewer reads from the site (docs/stores.md): the picker's IGV, 4DN,
      # ENCODE and session shelves. The same shallow, by-token fetch as the
      # archive; only the current files are copied in below, never the dated
      # copies under `archive/`. Absent until that workflow has run once, and
      # the picker says so.
      - name: Fetch the published stores
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" "$STORES_BRANCH" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$STORES_BRANCH" "$remote" stores
          else
            echo "No $STORES_BRANCH branch yet — the picker will say so until the Stores workflow has run."
          fi

      # The rendered notebooks, which notebooks.yml keeps on a branch of their
      # own on the same terms as the stores: the validation, the timings and the
      # parity (SPECS §18.10), each a self-contained page with its files beside
      # it. Absent until that workflow has published once. The laptop is not
      # among them: it is rendered by hand and committed (below).
      - name: Fetch the rendered notebooks
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" "$NOTEBOOKS_BRANCH" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$NOTEBOOKS_BRANCH" "$remote" rendered
          else
            echo "No $NOTEBOOKS_BRANCH branch yet — /validation/, /timings/ and /parity/ appear once the Notebooks workflow has run."
          fi

      # Previews belong to open pull requests, and preview.yml removes one when
      # its pull request closes. That removal is *event-shaped* and can be lost:
      # merging a pull request fires `pull_request: closed` and `push` to main
      # in the same instant, both land in this `pages` concurrency group, and
      # GitHub keeps only the newest pending run in a group — so if anything was
      # already deploying, the removal is cancelled a second after it queues and
      # the preview outlives its review. That is how #49 and #50 stayed in the
      # About dialog after they merged.
      #
      # So the deploy reconciles rather than trusting the event: every preview
      # in the manifest is asked about, and one whose pull request is no longer
      # open goes. Reconciliation rather than a second attempt at the event,
      # because it also covers a removal that failed, a pull request closed
      # while this workflow was broken, and a preview written before the removal
      # step existed. A pull request the API will not answer for is left alone:
      # "I could not ask" must never read as "it closed".
      - name: Drop the previews of pull requests that have closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f archive/versions.json ] || exit 0
          numbers=$(node -e '
            const { readFileSync } = require("node:fs")
            const manifest = JSON.parse(readFileSync("archive/versions.json", "utf8"))
            for (const row of manifest.pulls ?? []) {
              if (Number.isInteger(row?.number) && row.number > 0) console.log(row.number)
            }
          ')
          for number in $numbers; do
            state=$(gh api "repos/${{ github.repository }}/pulls/$number" --jq .state 2>/dev/null || echo unreadable)
            case "$state" in
              open) echo "#$number is open — keeping its preview." ;;
              closed) node scripts/archive-preview.mjs archive --remove "$number" ;;
              *) echo "::warning::could not read the state of #$number; leaving its preview alone" ;;
            esac
          done

      - name: Archive this build and prune what falls out of the window
        run: node scripts/archive-versions.mjs archive dist-pinned

      # Not fatal. A site that publishes correctly but fails to *remember* that
      # it did is a better outcome than one that does not publish, and the next
      # push re-adds this build from scratch — the script is idempotent per
      # commit. What is uploaded below is this working tree either way, so the
      # published site and its manifest agree even when this step does not run.
      - name: Publish the archive
        continue-on-error: true
        run: |
          set -euo pipefail
          cd archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --quiet --cached; then
            echo "Nothing changed."
          else
            git commit --quiet -m 'archive ${{ steps.commit.outputs.short }}'
            git push --quiet origin "HEAD:refs/heads/$ARCHIVE_BRANCH"
          fi

      # The published site is the site plus the archive. `versions.json` is
      # copied from the same working tree the directories came from, so the two
      # cannot disagree about what exists.
      # `pr/` holds the pull-request previews, written by preview.yml into the
      # same branch and listed in the same manifest; absent until the first
      # pull request has been previewed, hence the test. `stores/` is the current
      # files of the stores branch, fetched above, on the same terms.
      #
      # Copied by *shape* rather than by name — every `.json` at the root, plus
      # the `sessions/` directory — because the names are the generator's and
      # there are now about twenty of them: ENCODE alone is twelve shards, one
      # per assembly and output category (SPECS §24.3), and a list here would
      # be a third place to keep them in step with. `archive/` is deliberately
      # not copied: those are the dated copies, which the branch keeps and the
      # site has no reason to serve.
      #
      # `validation/`, `timings/` and `parity/` are the rendered notebooks, copied
      # whole from their branch, each directory named — by `pages.py published`,
      # the one table of them — rather than globbed, so that the branch can never
      # put anything else at the site's root; a `laptop/` the branch still holds
      # from before is not one of them. `laptop/` is the page rendered by hand
      # and committed as notebooks/laptop.html: `pages.py committed` writes it
      # as `laptop/index.html` and unpacks the table and the stamp the page
      # carries beside it. No `laptop/` until one is committed.
      - name: Assemble the site
        run: |
          set -euo pipefail
          cp -R archive/v dist/v
          if [ -d archive/pr ]; then cp -R archive/pr dist/pr; fi
          cp archive/versions.json dist/versions.json
          if [ -d stores ]; then
            mkdir -p dist/stores
            find stores -maxdepth 1 -name '*.json' -exec cp {} dist/stores/ \;
            if [ -d stores/sessions ]; then cp -R stores/sessions dist/stores/sessions; fi
            echo "Copied $(find dist/stores -name '*.json' | wc -l) store and session files."
          fi
          for page in $(python3 notebooks/scripts/pages.py published); do
            if [ -f "rendered/$page/index.html" ]; then cp -R "rendered/$page" "dist/$page"; fi
          done
          python3 notebooks/scripts/pages.py committed dist
          parts=(dist dist/v)
          for part in dist/pr dist/stores dist/validation dist/timings dist/parity dist/laptop; do
            if [ -d "$part" ]; then parts+=("$part"); fi
          done
          du -sh "${parts[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
