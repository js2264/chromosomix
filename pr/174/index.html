    <noscript>
      <div class="noscript">
        <h1>chromosomix</h1>
        <p>
          A genome browser for Hi-C and Micro-C contact maps (.cool, .mcool, .hic, HiC-Pro, .pairs), genome
          tracks (bigWig, BED, BAM, GTF and more) and 3D models, side by side, read straight from your files.
          It reads every one of them in the browser, so it needs JavaScript: nothing is uploaded, and there is
          no server to fall back to.
        </p>
        <p>
          Its analyses (insulation, compartments, loops, APA, P(s) and more) also run from the command line,
          with <code>npm install -g chromosomix</code>. The source code and documentation are at
          <a href="https://github.com/js2264/chromosomix">github.com/js2264/chromosomix</a>, and a summary
          in plain text at <a href="https://chromosomix.app/llms.txt">chromosomix.app/llms.txt</a>.
        </p>
      </div>
